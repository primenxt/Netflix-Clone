<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endless Runner</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

body {
    background: #080b14;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(#5ec8ff, #dff7ff);
}

/* SKY */

.sun {
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #fff27a;
    top: 70px;
    right: 10%;
    box-shadow: 0 0 50px #fff27a;
}

.cloud {
    position: absolute;
    width: 130px;
    height: 45px;
    background: white;
    border-radius: 50px;
    opacity: .8;
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: white;
    border-radius: 50%;
}

.cloud::before {
    width: 60px;
    height: 60px;
    left: 20px;
    bottom: 10px;
}

.cloud::after {
    width: 70px;
    height: 70px;
    right: 15px;
    bottom: 5px;
}

.cloud1 {
    top: 100px;
    left: 10%;
}

.cloud2 {
    top: 190px;
    left: 55%;
    transform: scale(.7);
}

/* MOUNTAINS */

.mountains {
    position: absolute;
    bottom: 190px;
    width: 100%;
    height: 220px;
    background:
        linear-gradient(135deg, transparent 50%, #496b83 50%) 0 100% / 240px 220px repeat-x;
    opacity: .8;
}

/* GROUND */

.ground {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 190px;
    background: #4b9b43;
    border-top: 10px solid #306c2c;
}

.road {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 125px;
    background: #444;
    border-top: 8px solid #555;
}

.road-line {
    position: absolute;
    bottom: 55px;
    width: 100%;
    height: 8px;
    background: repeating-linear-gradient(
        to right,
        white 0px,
        white 70px,
        transparent 70px,
        transparent 130px
    );
}

/* PLAYER */

#player {
    position: absolute;
    width: 55px;
    height: 70px;
    left: 120px;
    bottom: 125px;
    z-index: 10;
}

.head {
    position: absolute;
    width: 35px;
    height: 35px;
    background: #ffd0a6;
    border-radius: 50%;
    left: 10px;
    top: 0;
}

.body {
    position: absolute;
    width: 40px;
    height: 38px;
    background: #2563eb;
    border-radius: 12px 12px 5px 5px;
    left: 7px;
    top: 30px;
}

.eye {
    position: absolute;
    width: 5px;
    height: 5px;
    background: black;
    border-radius: 50%;
    top: 14px;
    left: 22px;
}

.leg {
    position: absolute;
    width: 10px;
    height: 20px;
    background: #172554;
    bottom: -10px;
}

.leg1 {
    left: 12px;
}

.leg2 {
    right: 12px;
}

/* OBSTACLE */

.obstacle {
    position: absolute;
    bottom: 125px;
    width: 35px;
    height: 55px;
    background: #7c2d12;
    border-radius: 8px 8px 3px 3px;
    z-index: 5;
}

.obstacle::before {
    content: "";
    position: absolute;
    width: 50px;
    height: 12px;
    background: #9a3412;
    left: -7px;
    top: 15px;
    border-radius: 10px;
}

/* COIN */

.coin {
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ffd700;
    border: 4px solid #f59e0b;
    bottom: 230px;
    z-index: 6;
    box-shadow: 0 0 15px #ffd700;
}

.coin::after {
    content: "$";
    position: absolute;
    color: #92400e;
    font-weight: bold;
    font-size: 15px;
    left: 6px;
    top: 2px;
}

/* UI */

#ui {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
}

.score-box {
    background: rgba(0,0,0,.45);
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    backdrop-filter: blur(5px);
}

.score-box div {
    margin: 4px 0;
}

#pause {
    border: none;
    background: rgba(0,0,0,.5);
    color: white;
    padding: 12px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 18px;
}

/* GAME OVER */

#gameOver {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.72);
    z-index: 200;
    display: none;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: white;
}

.panel {
    width: min(90%, 450px);
    background: #111827;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 20px 60px black;
}

.panel h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.panel p {
    margin: 10px;
    font-size: 20px;
}

button.main {
    margin-top: 20px;
    padding: 14px 30px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

button.main:hover {
    background: #16a34a;
}

/* START SCREEN */

#startScreen {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg,#111827,#1e3a8a);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
}

.start-panel {
    padding: 30px;
}

.start-panel h1 {
    font-size: clamp(40px, 8vw, 75px);
    margin-bottom: 10px;
}

.start-panel p {
    color: #cbd5e1;
    margin-bottom: 20px;
}

/* MOBILE CONTROLS */

#mobileControls {
    position: absolute;
    bottom: 25px;
    left: 0;
    right: 0;
    display: none;
    justify-content: center;
    z-index: 150;
}

#jumpButton {
    width: 100px;
    height: 60px;
    border-radius: 30px;
    border: none;
    background: rgba(0,0,0,.5);
    color: white;
    font-size: 18px;
}

/* RESPONSIVE */

@media (max-width: 700px) {

    #mobileControls {
        display: flex;
    }

    #player {
        left: 70px;
    }

    .sun {
        width: 60px;
        height: 60px;
    }

    .mountains {
        bottom: 190px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div class="sun"></div>

    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>

    <div class="mountains"></div>

    <div class="ground"></div>

    <div class="road">
        <div class="road-line"></div>
    </div>

    <!-- PLAYER -->

    <div id="player">

        <div class="head">
            <div class="eye"></div>
        </div>

        <div class="body"></div>

        <div class="leg leg1"></div>
        <div class="leg leg2"></div>

    </div>


    <!-- UI -->

    <div id="ui">

        <div class="score-box">

            <div>
                🏆 Score:
                <span id="score">0</span>
            </div>

            <div>
                🪙 Coins:
                <span id="coins">0</span>
            </div>

            <div>
                ⭐ Best:
                <span id="best">0</span>
            </div>

        </div>

        <button id="pause" onclick="togglePause()">
            ⏸️
        </button>

    </div>


    <!-- MOBILE -->

    <div id="mobileControls">

        <button id="jumpButton">
            🦘 JUMP
        </button>

    </div>


    <!-- START -->

    <div id="startScreen">

        <div class="start-panel">

            <h1>🏃 ENDLESS RUNNER</h1>

            <p>
                Jump over obstacles, collect coins and survive as long as possible!
            </p>

            <p>
                🎮 Press SPACE / ↑ to jump
            </p>

            <button class="main" onclick="startGame()">
                ▶ START GAME
            </button>

        </div>

    </div>


    <!-- GAME OVER -->

    <div id="gameOver">

        <div class="panel">

            <h1>💥 GAME OVER</h1>

            <p>
                Score: <strong id="finalScore">0</strong>
            </p>

            <p>
                Coins: <strong id="finalCoins">0</strong>
            </p>

            <p>
                Best Score: <strong id="finalBest">0</strong>
            </p>

            <button class="main" onclick="restartGame()">
                🔄 PLAY AGAIN
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

const player = document.getElementById("player");
const game = document.getElementById("game");

let isPlaying = false;
let isPaused = false;
let isJumping = false;

let playerBottom = 125;
let velocityY = 0;

let gravity = 1.2;

let score = 0;
let coins = 0;

let speed = 6;

let obstacleTimer = 0;
let coinTimer = 0;

let lastTime = 0;

let bestScore =
    Number(localStorage.getItem("endlessBest")) || 0;

document.getElementById("best").textContent = bestScore;


/* =========================
   SOUND SYSTEM
========================= */

let audioContext;

function sound(type) {

    try {

        if (!audioContext) {
            audioContext =
                new (window.AudioContext ||
                window.webkitAudioContext)();
        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        if (type === "jump") {

            oscillator.frequency.value = 500;
            gain.gain.value = 0.08;

        } else if (type === "coin") {

            oscillator.frequency.value = 900;
            gain.gain.value = 0.1;

        } else if (type === "gameover") {

            oscillator.frequency.value = 150;
            gain.gain.value = 0.12;

        }

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + .12
        );

    } catch(e) {}

}


/* =========================
   START GAME
========================= */

function startGame() {

    document.getElementById("startScreen")
        .style.display = "none";

    isPlaying = true;
    isPaused = false;

    score = 0;
    coins = 0;
    speed = 6;

    obstacleTimer = 0;
    coinTimer = 0;

    document.getElementById("score").textContent = 0;
    document.getElementById("coins").textContent = 0;

    document.querySelectorAll(".obstacle")
        .forEach(o => o.remove());

    document.querySelectorAll(".coin")
        .forEach(c => c.remove());

    requestAnimationFrame(gameLoop);
}


/* =========================
   JUMP
========================= */

function jump() {

    if (!isPlaying || isPaused)
        return;

    if (!isJumping) {

        isJumping = true;

        velocityY = 19;

        sound("jump");

    }

}


document.addEventListener("keydown", function(e) {

    if (
        e.code === "Space" ||
        e.code === "ArrowUp"
    ) {

        e.preventDefault();

        jump();

    }

});


document.getElementById("jumpButton")
    .addEventListener("touchstart", function(e) {

        e.preventDefault();

        jump();

    });


/* =========================
   CREATE OBSTACLE
========================= */

function createObstacle() {

    const obstacle =
        document.createElement("div");

    obstacle.className = "obstacle";

    obstacle.style.right = "-50px";

    game.appendChild(obstacle);

}


/* =========================
   CREATE COIN
========================= */

function createCoin() {

    const coin =
        document.createElement("div");

    coin.className = "coin";

    coin.style.right = "-50px";

    const height =
        180 + Math.random() * 100;

    coin.style.bottom = height + "px";

    game.appendChild(coin);

}


/* =========================
   COLLISION
========================= */

function collision(a, b) {

    const A = a.getBoundingClientRect();
    const B = b.getBoundingClientRect();

    return !(
        A.right < B.left ||
        A.left > B.right ||
        A.bottom < B.top ||
        A.top > B.bottom
    );

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(timestamp) {

    if (!isPlaying)
        return;

    if (isPaused) {

        requestAnimationFrame(gameLoop);

        return;

    }


    if (!lastTime)
        lastTime = timestamp;

    const delta =
        Math.min((timestamp - lastTime) / 16.67, 2);

    lastTime = timestamp;


    /* PLAYER PHYSICS */

    if (isJumping) {

        playerBottom +=
            velocityY * delta;

        velocityY -=
            gravity * delta;


        if (playerBottom <= 125) {

            playerBottom = 125;

            velocityY = 0;

            isJumping = false;

        }

        player.style.bottom =
            playerBottom + "px";

    }


    /* OBSTACLES */

    obstacleTimer += delta;

    if (obstacleTimer > 85) {

        createObstacle();

        obstacleTimer = 0;

    }


    const obstacles =
        document.querySelectorAll(".obstacle");


    obstacles.forEach(obstacle => {

        let right =
            parseFloat(
                obstacle.style.right
            ) || -50;

        right += speed * delta;

        obstacle.style.right =
            right + "px";


        if (collision(player, obstacle)) {

            endGame();

        }


        if (right > window.innerWidth + 100) {

            obstacle.remove();

        }

    });


    /* COINS */

    coinTimer += delta;

    if (coinTimer > 120) {

        createCoin();

        coinTimer = 0;

    }


    const coinElements =
        document.querySelectorAll(".coin");


    coinElements.forEach(coin => {

        let right =
            parseFloat(
                coin.style.right
            ) || -50;

        right += speed * delta;

        coin.style.right =
            right + "px";


        if (collision(player, coin)) {

            coins++;

            score += 25;

            document.getElementById("coins")
                .textContent = coins;

            coin.remove();

            sound("coin");

        }


        if (right > window.innerWidth + 100) {

            coin.remove();

        }

    });


    /* SCORE */

    score += 0.15 * delta;

    document.getElementById("score")
        .textContent = Math.floor(score);


    /* DIFFICULTY */

    speed += 0.0015 * delta;


    requestAnimationFrame(gameLoop);

}


/* =========================
   PAUSE
========================= */

function togglePause() {

    if (!isPlaying)
        return;

    isPaused = !isPaused;

    document.getElementById("pause")
        .textContent =
        isPaused ? "▶️" : "⏸️";

}


/* =========================
   GAME OVER
========================= */

function endGame() {

    if (!isPlaying)
        return;

    isPlaying = false;

    sound("gameover");

    const finalScore =
        Math.floor(score);

    if (finalScore > bestScore) {

        bestScore = finalScore;

        localStorage.setItem(
            "endlessBest",
            bestScore
        );

    }

    document.getElementById("finalScore")
        .textContent = finalScore;

    document.getElementById("finalCoins")
        .textContent = coins;

    document.getElementById("finalBest")
        .textContent = bestScore;

    document.getElementById("best")
        .textContent = bestScore;

    document.getElementById("gameOver")
        .style.display = "flex";

}


/* =========================
   RESTART
========================= */

function restartGame() {

    document.getElementById("gameOver")
        .style.display = "none";

    playerBottom = 125;

    velocityY = 0;

    isJumping = false;

    lastTime = 0;

    document.getElementById("pause")
        .textContent = "⏸️";

    startGame();

}


/* =========================
   PREVENT MOBILE SCROLL
========================= */

document.addEventListener("touchmove", function(e) {

    e.preventDefault();

}, { passive: false });

</script>

</body>
</html>
